<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwiftSphere - Everything You Need, Delivered Swiftly</title><link rel="icon" href="data:image/svg+xml,[STRIPPED]"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#111;color:#fff;padding-bottom:90px}
header{background:#000;color:#D4AF37;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #D4AF37}
header b{font-size:22px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
header small{display:block;font-size:10px;color:#fff;font-weight:normal}
.logoimg{width:45px;height:45px;border-radius:50%;border:2px solid #D4AF37;background:#D4AF37;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;flex-shrink:0}
button{background:#D4AF37;color:#000;border:none;padding:9px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
button.ghost{background:#222;color:#D4AF37;border:1px solid #D4AF37}
input,select{padding:10px;border-radius:10px;border:1px solid #D4AF37;width:100%;background:#222;color:#fff;margin:4px 0}
.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:10px;width:48%}
.card img,.card video{width:100%;height:130px;object-fit:cover}
.price{color:#D4AF37;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
.box{background:#1c1c1c;border:1px solid #D4AF37;padding:18px;border-radius:14px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.catbtn{margin:3px}
.banner{background:linear-gradient(90deg,#000,#3a2c00);border:1px solid #D4AF37;margin:12px;border-radius:14px;padding:18px;text-align:center}
.banner h2{color:#D4AF37;margin:0}
.checkout-bar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #D4AF37;padding:12px;text-align:center;z-index:20}
.checkout-bar button{width:95%;max-width:400px;padding:14px;font-size:16px;background:#FFD700;color:#000;border:2px solid #fff;box-shadow:0 0 15px #D4AF37}
</style></head><body>
<header><div id="logo" style="display:flex;align-items:center;gap:8px"><div class="logoimg">S</div><div><b>SWIFTSPHERE</b><small>Everything You Need, Delivered Swiftly</small></div></div><div><button onclick="dark()">🌙</button> <button onclick="showFav()">❤️ <span id="fc">0</span></button></div></header>

<div class="banner"><h2>SHOP FAST, DELIVERED WORLDWIDE</h2><p>Black + Gold Premium Store</p><input id="q" oninput="render()" placeholder="🔍 Search products..."></div>

<div style="padding:0 12px"><b id="catTap">Categories:</b><br>
<button class="catbtn" onclick="setCat('All')">All</button>
<button class="catbtn" onclick="setCat('Tech')">Tech</button>
<button class="catbtn" onclick="setCat('Beauty')">Beauty</button>
<button class="catbtn" onclick="setCat('Clothes & Shoes')">Clothes & Shoes</button>
<button class="catbtn" onclick="setCat('Baby Stuff & Toys')">Baby Stuff & Toys</button>
<button class="catbtn" onclick="setCat('Home & Kitchen')">Home & Kitchen</button>
<button class="catbtn" onclick="setCat('Cars')">🚗 Cars</button>
</div>

<div id="title" style="padding:12px;font-weight:bold;color:#D4AF37">🛍️ All Products</div>
<div id="grid" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 10px"></div>
<div class="checkout-bar"><button onclick="checkout()">🛒 Checkout via WhatsApp (<span id="cc">0</span>)</button></div>

<div class="modal" id="loginM"><div class="box"><h3 style="color:#D4AF37">Admin Login</h3><input id="pw" type="password" placeholder="Enter Password"><button onclick="login()">Login</button> <button class="ghost" onclick="hide('loginM')">Close</button></div></div>

<div class="modal" id="adminM"><div class="box"><h3 style="color:#D4AF37">Admin Dashboard</h3>
<input id="n" placeholder="Product Name"><input id="p" type="number" placeholder="Price ₦"><input id="img" placeholder="Image Link (or leave empty)">
 <input type="file" id="f" accept="image/*,video/*">
<select id="c"><option>Tech</option><option>Beauty</option><option>Clothes & Shoes</option><option>Baby Stuff & Toys</option><option>Home & Kitchen</option><option>Cars</option></select>
<button onclick="addP()">+ Add Product</button><button class="ghost" onclick="hide('adminM')">Close</button><div id="alist"></div></div></div>

<script>
let P=JSON.parse(localStorage.getItem('sp4')||'[]');
if(!P.length || !P[0].img || !P[0].c){P=[
{n:"Sneakers",p:25000,c:"Clothes & Shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&auto=format&fit=crop"},
{n:"Smart Watch",p:45000,c:"Tech",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format&fit=crop"},
{n:"Headphones",p:30000,c:"Tech",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&auto=format&fit=crop"},
{n:"Backpack",p:18000,c:"Clothes & Shoes",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&auto=format&fit=crop"},
{n:"Standing Fan",p:55000,c:"Home & Kitchen",img:"https://picsum.photos/seed/fan/400/300"},
{n:"Perfume",p:35000,c:"Beauty",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400&auto=format&fit=crop"},
{n:"Toyota Camry 2019",p:8500000,c:"Cars",img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=400&auto=format&fit=crop"}
];save()}
let F=JSON.parse(localStorage.getItem('sf')||'[]'),onlyFav=false,cart=[],cat='All';
function save(){localStorage.setItem('sp4',JSON.stringify(P));localStorage.setItem('sf',JSON.stringify(F))}
function dark(){document.body.style.background=document.body.style.background=='white'?'#111':'white';document.body.style.color=document.body.style.color=='black'?'#fff':'black'}
function setCat(c){cat=c;onlyFav=false;document.getElementById('title').innerText='🛍️ '+c;render()}
function showFav(){onlyFav=true;document.getElementById('title').innerText='❤️ Favorites';render()}
function fav(i){let id=P[i].n;F.includes(id)?F=F.filter(x=>x!=id):F.push(id);save();render()}
function checkout(){if(!cart.length)return alert('Cart empty');let t='Hello SwiftSphere, I want to order:\n';cart.forEach(x=>t+=x.n+' - ₦'+x.p+'\n');window.open('https://wa.me/2348103728199?text='+encodeURIComponent(t))}
 let taps=0,tapTimer=null;
let catTap=document.getElementById('catTap');
catTap.addEventListener('click',()=>{taps++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{taps=0},2000);if(taps>=3){taps=0;show('loginM')}});
function show(id){document.getElementById(id).style.display='flex'}
function hide(id){document.getElementById(id).style.display='none'}
function login(){if(document.getElementById('pw').value=='panda'){hide('loginM');show('adminM');listA()}else alert('Wrong Password')}
function addP(){let n=document.getElementById('n').value,p=+document.getElementById('p').value,c=document.getElementById('c').value,f=document.getElementById('f').files[0],img=document.getElementById('img')?document.getElementById('img').value:'';if(!n||!p)return alert('Fill name + price');let doAdd=(im)=>{P.unshift({n,p,c,img:im||'https://picsum.photos/400/300?random='+Date.now()});save();render();listA();alert('Added to '+c)};if(f){let r=new FileReader();r.onload=e=>doAdd(e.target.result);r.readAsDataURL(f);}else{doAdd(img);}}
function delP(i){P.splice(i,1);save();render();listA()}
function listA(){document.getElementById('alist').innerHTML=P.map((x,i)=>`<p>${x.n} - ${x.c} - ₦${x.p} <button onclick="delP(${i})">Delete</button></p>`).join('')}
function render(){
let q=(document.getElementById('q').value||'').toLowerCase();
let L=P.filter(x=>{
 if(onlyFav && !F.includes(x.n)) return false;
 if(cat!=='All' && x.c!==cat) return false;
 return x.n.toLowerCase().includes(q);
});
document.getElementById('fc').innerText=F.length;document.getElementById('cc').innerText=cart.length;
document.getElementById('grid').innerHTML=L.map((x)=>{
 let i=P.indexOf(x);
 let btn=x.c=='Cars'?`<button onclick="window.open('https://wa.me/2348103728199?text='+encodeURIComponent('Hello SwiftSphere, I want to Request This Car: ${x.n} - ₦${x.p}'))">🚗 Request This Car</button>`:`<button onclick="cart.push(P[${i}]);render()">Add to Cart</button>`;
 return `<div class="card">${x.img.includes('data:video')||x.img.includes('.mp4')?`<video src="${x.img}" controls muted playsinline></video>`:`<img src="${x.img}">`}<div class="p"><b>${x.n}</b><br><small>${x.c}</small><br><b>₦${x.p}</b><br>${btn}</div></div>`;
}).join('')||'<p>No product in this category yet.</p>';
}
render();
</script></body></html>
